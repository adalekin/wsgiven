# Publishes to PyPI when you push a version tag (e.g. v1.0.3).
# Configure a Trusted Publisher on PyPI and a GitHub Environment named "pypi"
# (see README "Publishing to PyPI").

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test (wheel)
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.whl)" \
            python -c "from wsgiven import Application, VERSION; assert Application and VERSION"

      - name: Smoke test (sdist)
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.tar.gz)" \
            python -c "from wsgiven import Application, VERSION; assert Application and VERSION"

      - name: Publish to PyPI
        run: uv publish
