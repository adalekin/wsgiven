[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "wsgiven"
dynamic = ["version"]
description = "A minimal WSGI routing toolkit for small services and tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alexey Dalekin" }]
keywords = ["wsgi", "web", "framework", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[project.urls]
Homepage = "https://github.com/adalekin/wsgiven"
Repository = "https://github.com/adalekin/wsgiven"
Issues = "https://github.com/adalekin/wsgiven/issues"

[tool.hatch.version]
path = "wsgiven/__init__.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["/wsgiven", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["wsgiven"]

[dependency-groups]
dev = [
    "pylint>=4.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "werkzeug>=3.1.0",
]

[tool.pytest.ini_options]
addopts = "-vvv --cov=wsgiven --cov-config=.coveragerc"
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
